<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Buttons</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@450;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0b;--ink:#f4f2ec;--ink-soft:#9b988f;--ink-faint:#5e5b54;--line:rgba(244,242,236,.13);--accent:#fb5b46;--accent-2:#ff7d6b;}
  *{margin:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding:56px}
  .kick{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  h1{font-weight:600;font-size:22px;letter-spacing:-.02em;margin-bottom:34px}
  .lab{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin:26px 0 14px}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:13px 22px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
  .btn-primary{background:var(--accent);color:#160a08;border-color:var(--accent)}
  .btn-primary .arr{color:#160a08}
  .btn-ghost{background:rgba(244,242,236,.04)}
  .btn-sm{padding:10px 16px;font-size:11.5px}
  .note{margin-top:34px;font-size:13px;color:var(--ink-faint);max-width:640px;line-height:1.6}
  .note b{color:var(--ink-soft)}
</style></head>
<body>
  <p class="kick">Components</p>
  <h1>Buttons</h1>
  <p class="lab">Primary — the one moment of red</p>
  <div class="row">
    <button class="btn btn-primary">Request access <span class="arr">&rarr;</span></button>
    <button class="btn btn-primary btn-sm">Request access</button>
  </div>
  <p class="lab">Secondary — quiet, ghost</p>
  <div class="row">
    <button class="btn btn-ghost">See how it works</button>
    <button class="btn">Documentation</button>
  </div>
  <p class="note"><b>Mono, uppercase, tight tracking.</b> Buttons read as controls, not marketing pills. Exactly one is filled red per view — primary action only.</p>
</body></html>
